# Single-server stack: Caddy (HTTPS reverse proxy) + PostgreSQL + backups + apps.
# All secrets / environment-specific values come from .env (see .env.example).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    healthcheck:
      # Caddy's admin API listens on localhost:2019 inside the container.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 128m
    logging: *default-logging

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    # No published ports and no edge network: reachable only from the data network.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Tuned for a small (4 GB) host shared with several apps.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    logging: *default-logging

  backup:
    # Same major version as the server so pg_dump matches.
    image: postgres:16.4-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_DIR: /backups
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-}
    # "daemon" runs scripts/backup.sh every night at 02:00 UTC.
    command: ["sh", "/usr/local/bin/backup.sh", "daemon"]
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q"]
      interval: 60s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    logging: *default-logging

  # Placeholder app so the stack works before real apps exist.
  app:
    image: ${PLACEHOLDER_APP_IMAGE:-mcr.microsoft.com/dotnet/samples:aspnetapp}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
    networks: [edge, data]
    healthcheck:
      # The image has no curl/wget, so use bash's /dev/tcp for a plain HTTP request.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET / HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -n1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # TEMPLATE: adding another app (copy, uncomment, and adjust the NAME parts).
  #
  #  myapp:
  #    image: ghcr.io/matt-hue/myapp:1.0.0   # explicit tag, never "latest"
  #    restart: unless-stopped
  #    environment:
  #      ASPNETCORE_URLS: http://+:8080
  #      ConnectionStrings__Default: Host=postgres;Database=myapp;Username=myapp;******
  #    networks: [edge, data]
  #    healthcheck:
  #      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
  #      interval: 30s
  #      timeout: 5s
  #      retries: 3
  #      start_period: 20s
  #    mem_limit: 256m
  #    logging: *default-logging
  #
  # Then: add MYAPP_DB_PASSWORD to .env and .env.example, add a site block to
  # caddy/Caddyfile, and run scripts/deploy.sh myapp.
  # ---------------------------------------------------------------------------

networks:
  edge: {} # caddy + apps
  data: {} # apps + postgres (+ backup)

volumes:
  caddy_data: {}
  caddy_config: {}
  postgres_data: {}
  backups: {}
